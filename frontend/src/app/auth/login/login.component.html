<div class="container-fluid">
  <div class="row tolo">
<!--    <div class="col-md-6 d-none d-md-block login-image"></div>-->
    <div class=" col-sm-12 login-form">
      <div class="login-internal">
        <div class="header">
          <h2 class="welcome-text">
            <mat-icon>lock_open</mat-icon> Welcome !
          </h2>
        </div>
        <form class="form" [formGroup]="loginForm" (ngSubmit)="submitForm()">
          <div class="form-group">
            <mat-form-field appearance="outline">
              <mat-label>Username</mat-label>
              <input matInput formControlName="username" placeholder="Enter your username" required>
              <mat-icon matSuffix>account_circle</mat-icon>
              <mat-error *ngIf="loginForm.controls['username'].invalid && (loginForm.controls['username'].dirty || loginForm.controls['username'].touched)">
                Please enter a valid username
              </mat-error>
            </mat-form-field>
          </div>
          <div class="form-group">
            <mat-form-field appearance="outline">
              <mat-label>Password</mat-label>
              <input matInput formControlName="password" type="password" placeholder="Enter your password" required>
              <mat-icon matSuffix>lock</mat-icon>
              <mat-error *ngIf="loginForm.controls['password'].invalid && (loginForm.controls['password'].dirty || loginForm.controls['password'].touched)">
                Please enter a valid password
              </mat-error>
            </mat-form-field>
          </div>
          <div class="text-center">
            <button mat-raised-button color="primary" class="btn-round btn-lg mt-4" [disabled]="loginForm.invalid">LOGIN</button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
